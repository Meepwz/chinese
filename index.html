html,body{height:100%;margin:0}
body{height:100vh;height:100dvh;touch-action:manipulation}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#app{height:100%}
.screen{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:0 16px 16px}
.scroll{flex:1;overflow:auto;min-height:0;padding:6px 2px 14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;height:60px}
.pill{background:var(--card);border-radius:30px;padding:6px 16px;font-weight:700;box-shadow:var(--sh)}
.fire{color:#ff6a1a}.fire b{display:inline-block;animation:flick 1.2s infinite}

.mas{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.panda{font-size:72px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.mas.sm .panda{font-size:48px}
@keyframes bob{50%{transform:translateY(-6px)}}
.bub{background:var(--card);border-radius:20px;padding:12px 16px;font-weight:600;box-shadow:var(--sh);position:relative}
.bub:before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--card)}

.lcard:active,.btn:active{transform:translateY(3px);border-bottom-width:3px}
.le{font-size:46px}.lt{flex:1;font-size:21px;font-weight:700}.ls{font-size:22px;letter-spacing:2px}
.h2{font-weight:700;margin:18px 0 8px}
.stk{display:flex;flex-wrap:wrap;gap:8px;font-size:38px}
.sub{color:var(--sub);font-size:16px}

.btn.ok{background:var(--ok);border-color:var(--okD)}.btn.no{background:var(--no);border-color:var(--noD)}
.btn.alt{background:var(--card);color:var(--text);border-color:var(--line)}

.top{display:flex;align-items:center;gap:14px;height:60px}
.x{width:44px;height:44px;font-size:24px;border-radius:50%;background:var(--card);box-shadow:var(--sh)}
.track{flex:1;height:18px;border-radius:9px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--sun);border-radius:9px;transition:width .4s}
.body{flex:1;display:flex;flex-direction:column;min-height:0;gap:12px}
.q{font-size:22px;font-weight:700;margin:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.big-e{font-size:96px;line-height:1.1}
.zh{font-family:"Kaiti SC","KaiTi","STKaiti","Noto Sans SC",sans-serif;font-size:76px;font-weight:700;line-height:1.1}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.stars{font-size:64px;letter-spacing:6px}.stars span{display:inline-block;animation:pop .5s backwards}

.in{width:100%;font:16px/1.4 "Mali","Noto Sans Thai",system-ui,sans-serif;border:3px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card);color:var(--text);user-select:text;-webkit-user-select:text;resize:vertical}

body{font-size:22px}

.zh{font-size:104px}.zh.sm{font-size:84px}.py{font-size:38px}.big-e{font-size:120px}

function build(l){
  var W=l.w.map(function(w,i){return {id:'w'+i,z:w[0],p:w[1],th:w[2],e:w[3]}}),st=[];
  function pick(i,pool){return shuf([pool[i]].concat(shuf(pool.filter(function(_,k){return k!==i})).slice(0,3)))}
  function ix(a){return shuf(a.map(function(_,i){return i}))}
  W.forEach(function(w){st.push({k:'cw',w:w})});
  l.s.forEach(function(s){st.push({k:'cs',s:s})});
  var th=W.map(function(w){return {id:w.id,th:w.th,e:w.e}});
  ix(W).slice(0,3).forEach(function(i){st.push({k:'pic',q:'แตะรูปที่ตรงกับคำนี้',w:W[i],o:pick(i,th),a:W[i].id,ans:W[i].th})});
  ix(W).slice(0,2).forEach(function(i){st.push({k:'lw',q:'แตะคำจีนที่ตรงกับความหมายนี้',w:W[i],o:pick(i,W),a:W[i].id,ans:W[i].z+' ('+W[i].p+')'})});
  if(new Set(W.map(function(w){return w.e})).size===W.length)st.push({k:'mt',ws:W,r:shuf(W.map(function(w){return w.id}))});
  var os=l.s.map(function(s,k){return {id:'s'+k,s:s}}),i0=Math.floor(Math.random()*os.length);
  if(os.length>1)st.push({k:'ls',q:'แตะประโยคจีนที่ตรงกับความหมายนี้',s:os[i0].s,o:pick(i0,os),a:'s'+i0,ans:pw(os[i0].s.w,24)});
  if(l.g)st.push({k:'gr',g:l.g});
  l.ch.forEach(function(c){st.push({k:'st',c:c})});
  l.s.forEach(function(s){var c=s.w.filter(function(x){return x[1]}).map(function(x){return x[0]});if(c.length>1&&new Set(c).size===c.length&&st.filter(function(x){return x.k==='or'}).length<2)st.push({k:'or',s:s,bank:shuf(c),a:c,ans:pw(s.w.filter(function(x){return x[1]}),24)})});
  
  return st;
}

function bSq(c){return '<div class="center" style="flex:none"><div style="font-size:84px;line-height:1.1">'+c.e+'</div></div><p class="q" style="margin:4px 0 8px">'+c.q+'</p><div class="scroll" style="display:flex;flex-direction:column;gap:8px;justify-content:flex-start">'+c.o.map(function(o){return '<button class="opt"'+(S.wrong.indexOf(o.id)>=0?' disabled':'')+' data-a="opt" data-v="'+o.id+'" style="flex:none;min-height:64px;flex-direction:row;justify-content:flex-start;text-align:left;font-size:21px;padding:10px 16px">'+o.t+'</button>'}).join('')+'</div>'}
function bOr(c){
  var rem=c.bank.filter(function(w){return S.pk.indexOf(w)<0});
  return '<p class="q">เรียงคำให้เป็นประโยค</p><div class="th" style="text-align:center">'+c.s.th+'</div>'+snd(txt(c.s),1)+'<div class="slot">'+S.pk.map(function(w){return '<button class="chip" data-a="un" data-v="'+w+'">'+cp(c,w)+'</button>'}).join('')+'</div><div class="scroll" style="display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start">'+rem.map(function(w){return '<button class="chip" data-a="or" data-v="'+w+'">'+cp(c,w)+'</button>'}).join('')+'</div><button class="btn" data-a="ock"'+(S.pk.length===c.bank.length?'':' disabled')+'>ตรวจคำตอบ</button>';
}
function bSp(c){
  var p=S.sp,m='แตะไมค์แล้วพูดตามนะ';
  if(p.st==='rec')m='กำลังฟังอยู่… พูดได้เลย!';
  if(p.st==='retry')m=(p.heard?'ได้ยินว่า “'+p.heard+'” ':'')+'ลองอีกครั้งนะ สู้ ๆ!';
  if(p.st==='ok')m='เก่งมาก! พูดได้ชัดเลย 🎉';
  if(p.st==='pass')m='ไม่เป็นไรนะ ฝึกไปเรื่อย ๆ ก็เก่งขึ้น!';
  var fb=p.st==='fb';
  return '<p class="q">พูดตามแพนด้านะ</p><div class="center">'+pw(c.s.w,44)+'<div class="th" style="margin-top:6px">'+c.s.th+'</div>'+snd(txt(c.s))+'</div>'+
  (fb?'<p class="sub" style="text-align:center">เครื่องนี้ใช้ตรวจเสียงพูดไม่ได้ พูดตามออกเสียงแล้วกดปุ่มด้านล่างได้เลย</p><button class="btn ok" data-a="spdone">ฉันพูดแล้ว!</button>':
  '<div class="center" style="flex:none"><button class="mic'+(p.st==='rec'?' rec':'')+'" data-a="mic" aria-label="พูด">🎙️</button><p style="margin:8px 0 0;text-align:center;font-weight:600">'+m+'</p></div>'+
  (p.st==='ok'||p.st==='pass'?'<button class="btn ok" data-a="spnext">ต่อไป ›</button>':(p.n>=1?'<button class="btn alt" data-a="spskip">ข้ามข้อนี้</button>':'<div style="height:62px"></div>')));
}
function vEx(){
  var c=cs(),b={cw:bCard,cs:bCard,pic:bChoice,lw:bChoice,ls:bChoice,gr:bGr,st:bSt,or:bOr,sp:bSp,mt:bMt,pv:bPv,fb:bFb,wt:bWt,sq:bSq}[c.k](c);
  var h='<div class="screen"><div class="top"><button class="x" data-a="home" aria-label="ปิด">✕</button><div class="track"><div class="fill" style="width:'+(S.i/S.steps.length*100)+'%"></div></div><span style="font-size:30px">🐼</span></div><div class="body">'+b+'</div></div>';
  if(S.fb)h+='<div class="sheet '+(S.fb.ok?'ok':'no')+'"><div><div class="shin"><span class="sp">🐼</span><div><b>'+(S.fb.ok?rnd(PRAISE):'ไม่เป็นไรนะ')+'</b>'+(S.fb.rev?'<div>คำตอบคือ '+S.fb.ans+'</div>':'')+'</div></div><button class="btn '+(S.fb.ok?'ok':'no')+'" data-a="next">ต่อไป ›</button></div></div>';
  return h;
}
function vRes(){
  var r=S.res;return '<div class="screen"><div class="center"><div class="panda" style="font-size:96px">🐼</div><div class="stars">'+[1,2,3].map(function(k){return '<span>'+(k<=r.stars?'⭐':'☆')+'</span>'}).join('')+'</div><h2 style="margin:6px 0">'+(r.stars===3?'สุดยอดไปเลย!':r.stars===2?'เก่งมาก!':'ผ่านด่านแล้ว!')+'</h2>'+'<div class="pill" style="font-size:32px;margin:4px 0">'+(Math.round(r.pts*10)/10)+' / '+r.tot+'</div><div class="sub" style="margin-bottom:8px">คะแนนที่ได้ / คะแนนเต็ม</div>'+
  '<div class="th">ได้สติกเกอร์ใหม่ <span style="font-size:44px;vertical-align:middle">'+r.sticker+'</span></div><div class="pill fire" style="margin-top:12px"><b>🔥</b> เรียนต่อเนื่อง '+streak()+' วัน</div></div><button class="btn" data-a="home">กลับหน้าหลัก</button></div>';
}
function render(){
  $.innerHTML=S.r==='home'?vHome():S.r==='ex'?vEx():S.r==='ed'?vEd():S.r==='bk'?vBk():S.r==='hs'?vHs():vRes();
  if(S.r==='ex'&&(cs().k==='st'||cs().k==='wt'))setupPad();
}

/* tracing pad */
function setupPad(){
  var pad=document.getElementById('pad'),cv=document.getElementById('cv');if(!cv)return;
  var r=pad.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;
  var x=cv.getContext('2d');x.scale(d,d);x.lineWidth=r.height/28;x.lineCap=x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).color;
  function ln(a){if(a.length<2)return;x.beginPath();x.moveTo(a[0][0],a[0][1]);for(var i=1;i<a.length;i++)x.lineTo(a[i][0],a[i][1]);x.stroke()}
  if(!S.pdone)S.pad.forEach(ln);
  var cur=null;function pt(e){var b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}
  cv.onpointerdown=function(e){if(S.pdone)return;cv.setPointerCapture(e.pointerId);cur=[pt(e)]};
  cv.onpointermove=function(e){if(!cur)return;var p=pt(e),l=cur[cur.length-1];cur.push(p);ln([l,p])};
  cv.onpointerup=cv.onpointercancel=function(){if(!cur)return;var c=cur;cur=null;if(c.length>1){S.pad.push(c);render()}};
}

/* flow */
function good(){S.pts+=[1,.5][S.tries]||.25;S.fb={ok:1}}
function bad(id){
  S.tries++;
  if(S.tries>=2){S.pts+=.25;S.fb={ok:0,rev:1,ans:cs().ans}}else{if(id)S.wrong.push(id);note(rnd(TRY))}
}
function go(){
  stopAll();S.mt={sel:null,done:[],miss:0};S.fb=null;S.tries=0;S.wrong=[];S.pk=[];S.pad=[];S.pdone=false;S.wsh=false;S.sp={st:'idle',heard:'',n:0};
  if(S.i+1>=S.steps.length)return finish();
  S.i++;render();
}
function finish(){
  var l=AL()[S.li],ratio=S.pts/S.games,stars=ratio>=.8?3:ratio>=.5?2:1,sticker=rnd(STK);
  D.done[l.id]=Math.max(D.done[l.id]||0,stars);D.st.push(sticker);if(D.st.length>30)D.st.shift();D.hist=D.hist||[];D.hist.push({t:Date.now(),n:(l.sub==='sci'?'🔬 ':'')+l.t,p:Math.round(S.pts*100)/100,o:S.games,w:S.wk||0,wn:S.steps.filter(function(s){return s.k==='wt'}).length});if(D.hist.length>300)D.hist.shift();touchDay();save();
  S.res={stars:stars,sticker:sticker,pts:S.pts,tot:S.games};S.r='res';render();
}
function norm(s){return s.replace(/[^\u4e00-\u9fff]/g,'')}
function sim(h,t){if(!t)return 0;var hit=0;for(var i=0;i<t.length;i++)if(h.indexOf(t[i])>=0)hit++;return hit/t.length}
function mic(){
  if(!SR){S.sp.st='fb';return render()}
  if(S.sp.st==='rec')return;stopAll();
  var r=new SR();REC=r;r.lang='zh-CN';r.maxAlternatives=3;r.interimResults=false;var got=false;
  r.onresult=function(e){got=true;var best=0,first='';for(var i=0;i<e.results[0].length;i++){var a=e.results[0][i].transcript;if(!i)first=a;best=Math.max(best,sim(norm(a),norm(txt(cs().s))))}
    S.sp.heard=first;S.sp.n++;S.sp.st=best>=.6?'ok':(S.sp.n>=2?'pass':'retry');if(S.sp.st==='ok')S.pts+=S.sp.n===1?1:.5;if(S.sp.st==='pass')S.pts+=.3;render()};
  r.onerror=function(e){got=true;if(e.error==='not-allowed'||e.error==='service-not-allowed')S.sp.st='fb';else{S.sp.st='retry';S.sp.heard=''}render()};
  r.onend=function(){if(REC===r)REC=null;if(!got&&S.sp.st==='rec'){S.sp.st='retry';S.sp.heard='';render()}};
  try{S.sp.st='rec';r.start();render()}catch(e){S.sp.st='fb';render()}
}
function A(a,v){
  var c=S.steps[S.i];
  switch(a){
  case 'open':S.mt={sel:null,done:[],miss:0};S.wsh=false;S.wk=0;S.li=+v;S.steps=build(AL()[S.li]);S.games=S.steps.filter(function(s){return GAMES[s.k]}).length;S.i=0;S.pts=0;S.fb=null;S.tries=0;S.wrong=[];S.pk=[];S.pad=[];S.sp={st:'idle',heard:'',n:0};S.r='ex';break;
  case 'home':stopAll();S.r='home';break;
  case 'new':S.ed=-1;S.r='ed';break;
  case 'bk':S.r='bk';break;
  case 'hs':S.r='hs';break;
  case 'sub':S.sub=v;break;
  case 'hcp':var hta=document.createElement('textarea');hta.value=hsTxt();document.body.appendChild(hta);hta.select();try{navigator.clipboard.writeText(hta.value)}catch(e){document.execCommand('copy')}hta.remove();note('คัดลอกแล้ว ส่งให้ผู้ปกครองได้เลย');return;
  case 'hdel':if(!confirm('ล้างประวัติคะแนนทั้งหมดใช่ไหม?'))return;D.hist=[];save();break;
  case 'wshow':S.wsh=true;break;
  case 'wok':S.pts+=1;S.wk=(S.wk||0)+1;go();return;
  case 'wno':S.pts+=.25;go();return;
  case 'cpy':var tb=document.getElementById('bk_t');tb.select();try{navigator.clipboard.writeText(tb.value)}catch(e){document.execCommand('copy')}note('คัดลอกแล้ว');return;
  case 'imp':if(!confirm('ข้อมูลในเครื่องนี้จะถูกแทนที่ ตกลงไหม?'))return;
   try{var x=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('bk_t').value.replace(/\s/g,'')))));if(!x||!Array.isArray(x.cu))throw 0;D.cu=x.cu;D.hist=x.hist||[];D.done=x.done||{};D.st=x.st||[];D.streak=x.streak||0;D.last=x.last||'';save();S.r='home';break}catch(e){note('รหัสไม่ถูกต้อง ลองคัดลอกมาใหม่ทั้งหมดนะ');return}
  case 'ml':if(S.fb||S.mt.done.indexOf(v)>=0)return;S.mt.sel=v;break;
  case 'mr':if(S.fb||S.mt.done.indexOf(v)>=0)return;if(!S.mt.sel){note('แตะคำจีนก่อนนะ');return}
   if(v===S.mt.sel){S.mt.done.push(v);S.mt.sel=null;say(c.ws.filter(function(x){return x.id===v})[0].z);if(S.mt.done.length===c.ws.length){S.pts+=S.mt.miss?(S.mt.miss<3?.5:.25):1;S.fb={ok:1}}}else{S.mt.miss++;S.mt.sel=null;note(rnd(TRY))}break;
  case 'edit':S.ed=+v;S.r='ed';break;
  case 'save':saveEd();return;
  case 'del':if(confirm('ลบบทเรียนนี้ใช่ไหม?')){var dl=D.cu.splice(S.ed,1)[0];delete D.done[dl.id];save();S.r='home';break}return;
  case 'say':say(v);return;
  case 'slow':say(v,1);return;
  case 'next':go();return;
  case 'opt':if(S.fb||S.wrong.indexOf(v)>=0)return;if(v===c.a)good();else bad(v);break;
  case 'or':S.pk.push(v);break;
  case 'un':S.pk=S.pk.filter(function(w){return w!==v});break;
  case 'ock':if(S.fb)return;if(S.pk.join('|')===c.a.join('|'))good();else{S.pk=[];bad()}break;
  case 'clr':S.pad=[];S.pdone=false;break;
  case 'pdone':if(!S.pdone){S.pdone=true;S.pts+=1;note(rnd(PRAISE)+' เขียนสวยมาก!');break}go();return;
  case 'mic':mic();return;
  case 'spdone':S.pts+=.5;go();return;
  case 'spnext':case 'spskip':if(a==='spskip')S.pts+=.1;go();return;
  }
  render();
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(t&&!t.disabled)A(t.dataset.a,t.dataset.v)});
render();
})();
</script>
