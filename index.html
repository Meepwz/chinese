/* tracing pad */
function setupPad(){
  var pad=document.getElementById('pad'),cv=document.getElementById('cv');if(!cv)return;
  var r=pad.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;
  var x=cv.getContext('2d');x.scale(d,d);x.lineWidth=r.width/28;x.lineCap=x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).color;
  function ln(a){if(a.length<2)return;x.beginPath();x.moveTo(a[0][0],a[0][1]);for(var i=1;i<a.length;i++)x.lineTo(a[i][0],a[i][1]);x.stroke()}
  if(!S.pdone)S.pad.forEach(ln);
  var cur=null;function pt(e){var b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}
  cv.onpointerdown=function(e){if(S.pdone)return;cv.setPointerCapture(e.pointerId);cur=[pt(e)]};
  cv.onpointermove=function(e){if(!cur)return;var p=pt(e),l=cur[cur.length-1];cur.push(p);ln([l,p])};
  cv.onpointerup=cv.onpointercancel=function(){if(!cur)return;var c=cur;cur=null;if(c.length>1){S.pad.push(c);render()}};
}

  if(S.tries>=2){S.pts+=.25;S.fb={ok:0,rev:1,ans:cs().ans}}else{if(id)S.wrong.push(id);note(rnd(TRY))}
}

}
function finish(){
  var l=AL()[S.li],ratio=S.pts/S.games,stars=ratio>=.8?3:ratio>=.5?2:1,sticker=rnd(STK);
  D.done[l.id]=Math.max(D.done[l.id]||0,stars);D.st.push(sticker);if(D.st.length>30)D.st.shift();touchDay();save();
  S.res={stars:stars,sticker:sticker};S.r='res';render();
}
function norm(s){return s.replace(/[^\u4e00-\u9fff]/g,'')}

}
